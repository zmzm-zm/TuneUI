
name: TuneUI Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows MinGW Build & Test
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Show toolchain versions
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Configure CMake
        run: |
          cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DTUNEUI_BUILD_TESTS=ON \
          -DTUNEUI_BUILD_EXAMPLES=ON
        shell: msys2 {0}

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            -LE requires-display

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TuneUI-Windows-MinGW-Release
          path: |
            build/libTuneUI.a
            build/examples/*.exe
            build/tests/*.exe
          if-no-files-found: warn
